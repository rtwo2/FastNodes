name: Validate Collector

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    paths:
      - "ProxyCollector/**/*.cs"
      - "ProxyCollector/**/*.csproj"
      - "scripts/validate_outputs.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test output validator
        run: python3 scripts/validate_outputs.py --self-test

      - name: Build collector
        run: dotnet build ProxyCollector --configuration Release

      - name: Commit & push (single-commit history)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — skipping push"
            exit 0
          fi

          PROXY_COUNT=$(wc -l < sub/everything.txt 2>/dev/null || echo 0)

          git checkout --orphan fastnodes-tip

          git rm -rf --cached -q -- 'ProxyCollector/*.mmdb' 2>/dev/null || true

          git add -A -- . ':(exclude)ProxyCollector/*.mmdb'

          git commit -m "FastNodes auto-update $(date +'%Y-%m-%d %H:%M UTC') — ${PROXY_COUNT} proxies"

          git push --force origin fastnodes-tip:main

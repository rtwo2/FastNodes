name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Validate validator self-tests
        run: python3 scripts/validate_outputs.py --self-test
      - name: Validate committed subscription outputs
        run: python3 scripts/validate_outputs.py sub
      - name: Build ProxyCollector
        run: dotnet build ProxyCollector --configuration Release
      - name: Run parser regression tests
        run: dotnet run --configuration Release --project ProxyCollector.Tests

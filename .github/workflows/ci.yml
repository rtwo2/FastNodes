name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New pushes to the same PR cancel stale checks instead of queueing duplicate work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: Validate validator self-tests
        run: python3 scripts/validate_outputs.py --self-test
      - name: Test collection health safeguards
        run: python3 scripts/check_collection_health.py --self-test
      - name: Test source health summary
        run: python3 scripts/summarize_source_health.py --self-test
      - name: Test source health trend tracking
        run: python3 scripts/track_source_health.py --self-test
      - name: Test ranking calibration analysis
        run: python3 scripts/summarize_ranking_calibration.py --self-test
      - name: Validate Cloudflare/WARP audit self-tests
        run: python3 scripts/audit_cloudflare_warp.py --self-test
      - name: Build ProxyCollector
        run: dotnet build ProxyCollector --configuration Release
      - name: Run parser regression tests
        run: dotnet run --configuration Release --project ProxyCollector.Tests
      - name: Setup pinned Xray for integration tests
        env:
          XRAY_VERSION: 26.3.27
        run: |
          set -euo pipefail
          mkdir -p /tmp/xraybin
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip" | sha256sum --check -
          unzip -o -j /tmp/xray.zip xray -d /tmp/xraybin
          chmod +x /tmp/xraybin/xray
          /tmp/xraybin/xray version
      - name: Run network and Xray integration tests
        run: dotnet run --configuration Release --project ProxyCollector.IntegrationTests
        env:
          XRAY_BIN: /tmp/xraybin/xray

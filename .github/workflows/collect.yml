      - name: Track source health trends and summarize ranking calibration
        if: ${{ success() && (inputs.source_limit == '' || inputs.source_limit == '0') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/track_source_health.py \
            --input sub/diagnostics/source-health.csv \
            --history state/source-health-history.json \
            --output sub/diagnostics/source-health-trends.csv \
            --max-snapshots 14
          python3 scripts/summarize_ranking_calibration.py \
            --input sub/diagnostics/ranking-calibration-summary.csv \
            --output sub/diagnostics/ranking-calibration-notes.md \
            --min-sample 50

      - name: Drop malformed VLESS lines before validating outputs
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Reject the malformed authority shape "vless://user @host:port".
          # Keep this narrowly scoped: valid links and YAML/config entries are untouched.
          bad = re.compile(r"^vless://\S+\s+@", re.IGNORECASE)
          removed = 0
          for path in Path("sub").rglob("*.txt"):
              original = path.read_text(encoding="utf-8-sig")
              lines = original.splitlines(keepends=True)
              kept = [line for line in lines if not bad.match(line.rstrip("\r\n"))]
              removed += len(lines) - len(kept)
              if len(lines) != len(kept):
                  path.write_text("".join(kept), encoding="utf-8")
          print(f"Removed {removed} malformed VLESS line(s) before output validation.")
          PY

      - name: Check collection regression and output-size ceilings
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        run: python3 scripts/check_collection_health.py check --root sub --baseline /tmp/fastnodes-output-baseline.json --report /tmp/fastnodes-output-health.json

      - name: Validate generated subscriptions before publishing
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          top_part_files=(sub/top_part*.txt)
          top_files=(sub/top.txt "${top_part_files[@]}")
          everything_files=(sub/everything*.txt)
          verified_part_files=(sub/verified_part*.txt)
          verified_files=(sub/verified.txt "${verified_part_files[@]}")
          verified_last_good_part_files=(sub/verified_last_good_part*.txt)
          verified_last_good_files=(sub/verified_last_good.txt "${verified_last_good_part_files[@]}")

          # Only the main shortlist and master catalogue must be non-empty.
          files_to_validate=("${top_files[@]}" "${everything_files[@]}")
          for file in "${files_to_validate[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required subscription part is missing or empty: $file"
              exit 1
            fi
            if grep -Eiq '<!doctype html|<html|access denied|rate limit exceeded' "$file"; then
              echo "::error::HTML/error response detected in generated subscription: $file"
              exit 1
            fi
            if ! grep -Eiq '^(vmess|vless|trojan|ss|shadowsocks|ssr|hysteria2?|hy2|tuic|naive|anytls|brook|snell|juicity|mieru|wireguard|wg|socks5?|socks4)://' "$file"; then
              echo "::error::No recognized proxy URI schemes found in $file"
              exit 1
            fi
          done

          for file in "${verified_files[@]}" "${verified_last_good_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Verification feed is missing: $file"
              exit 1
            fi
            if [[ -s "$file" ]]; then
              if grep -Eiq '<!doctype html|<html|access denied|rate limit exceeded' "$file"; then
                echo "::error::HTML/error response detected in verification feed: $file"
                exit 1
              fi
              if ! grep -Eiq '^(vmess|vless|trojan|ss|shadowsocks|ssr|hysteria2?|hy2|tuic|naive|anytls|brook|snell|juicity|mieru|wireguard|wg|socks5?|socks4)://' "$file"; then
                echo "::error::No recognized proxy URI schemes found in verification feed: $file"
                exit 1
              fi
            fi
          done

          top_count=$(awk 'END { print NR }' "${top_files[@]}")
          if (( top_count > 1000 )); then
            echo "::error::top.txt exceeds its 1000-node contract ($top_count)"
            exit 1
          fi
          verified_count=$(awk 'END { print NR }' "${verified_files[@]}")
          verified_last_good_count=$(awk 'END { print NR }' "${verified_last_good_files[@]}")
          everything_count=$(awk 'END { print NR }' "${everything_files[@]}")
          echo "Validated top.txt=$top_count verified-current=$verified_count verified-last-good=$verified_last_good_count everything collection=$everything_count across ${#everything_files[@]} parts"

      - name: Validate every generated text subscription
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        run: python3 scripts/validate_outputs.py sub

      - name: Final Cloudflare/WARP endpoint audit
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if find sub -type f -iname '*cloudflare*' -print -quit | grep -q .; then
            echo "::error::Cloudflare-labelled output file detected; refusing to publish"
            find sub -type f -iname '*cloudflare*' -print
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors https://www.cloudflare.com/ips-v4 -o /tmp/cf-ips-v4
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors https://www.cloudflare.com/ips-v6 -o /tmp/cf-ips-v6
          python3 scripts/audit_cloudflare_warp.py --self-test
          python3 scripts/audit_cloudflare_warp.py sub /tmp/cf-ips-v4 /tmp/cf-ips-v6

      - name: Summarize per-source contribution and failures
        if: ${{ always() && steps.collector.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cp sub/diagnostics/source-health.csv /tmp/fastnodes-source-health.csv
          python3 scripts/summarize_source_health.py --input /tmp/fastnodes-source-health.csv --output /tmp/fastnodes-source-health-summary.md

      - name: Upload build and collector logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fastnodes-build-and-run-logs
          path: |
            /tmp/fastnodes-build.log
            /tmp/fastnodes-run.log
            /tmp/fastnodes-output-health.json
            /tmp/fastnodes-source-health-summary.md
            /tmp/fastnodes-source-health.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit & push (single-commit history)
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — skipping push"
            exit 0
          fi

          shopt -s nullglob
          EVERYTHING_FILES=(sub/everything*.txt)
          PROXY_COUNT=$(awk 'END { print NR }' "${EVERYTHING_FILES[@]}")
          # Remember the exact main revision checked out at the start of this run.
          BASE_SHA=$(git rev-parse HEAD)

          git checkout --orphan fastnodes-tip
          git rm -rf --cached -q -- 'ProxyCollector/*.mmdb' 2>/dev/null || true
          git add -A -- . ':(exclude)ProxyCollector/*.mmdb'
          git commit -m "FastNodes auto-update $(date +'%Y-%m-%d %H:%M UTC') — ${PROXY_COUNT} proxies"

          # Never overwrite a main revision created after this run checked out.
          git fetch origin main
          if git push --force-with-lease="refs/heads/main:${BASE_SHA}" origin fastnodes-tip:main; then
            echo "Push succeeded"
          else
            echo "::error::main changed during collection; refusing to overwrite newer commits. Rerun the workflow."
            exit 1
          fi

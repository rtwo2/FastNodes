name: Collect Proxies

on:
  schedule:
    - cron: '17 * * * *'   # off the :00 congestion
  workflow_dispatch:

concurrency:
  group: collect            # queue, never two collectors at once

permissions:
  contents: write

jobs:
  Collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Setup xray-core
        run: |
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -o -j /tmp/xray.zip xray -d /tmp/xraybin
          chmod +x /tmp/xraybin/xray
          /tmp/xraybin/xray version

      - name: Run ProxyCollector
        run: ulimit -n 65535 2>/dev/null || true; dotnet run --configuration Release --project ProxyCollector
        env:
          XRAY_BIN: /tmp/xraybin/xray
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH: ${{ secrets.WORKER_AUTH }}
          Sources: |

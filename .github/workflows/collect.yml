name: Collect Proxies

on:
  # Run a fresh collection after collector code changes on main.
  # Tests, validators, and workflow-only edits use CI; scheduled runs refresh data.
  push:
    branches: [main]
    paths:
      - "ProxyCollector/**"
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Sources for a non-publishing smoke test (0 = full production collection)"
        type: choice
        required: true
        default: "0"
        options:
          - "0"
          - "5"
          - "10"

concurrency:
  group: collect
  # A fresh code push supersedes obsolete work; scheduled/manual runs do not cancel active runs.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  Collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - name: Run output-validator self-tests
        run: python3 scripts/validate_outputs.py --self-test

      - name: Capture previous output baseline
        if: ${{ inputs.source_limit == '' || inputs.source_limit == '0' }}
        run: python3 scripts/check_collection_health.py capture --root sub --output /tmp/fastnodes-output-baseline.json

      - name: Build ProxyCollector
        shell: bash
        run: |
          set -o pipefail
          dotnet build ProxyCollector --configuration Release 2>&1 | tee /tmp/fastnodes-build.log

      - name: Run parser and IP-family regression tests
        run: dotnet run --configuration Release --project ProxyCollector.Tests

      - name: Setup xray-core (pinned for reproducible verification)
        env:
          XRAY_VERSION: 26.3.27
        run: |
          set -euo pipefail
          mkdir -p /tmp/xraybin
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip" | sha256sum --check -
          unzip -o -j /tmp/xray.zip xray -d /tmp/xraybin
          chmod +x /tmp/xraybin/xray
          /tmp/xraybin/xray version

      - name: Run network and Xray integration tests
        run: dotnet run --configuration Release --project ProxyCollector.IntegrationTests
        env:
          XRAY_BIN: /tmp/xraybin/xray

      - name: Run ProxyCollector
        id: collector
        shell: bash
        run: |
          set -o pipefail
          ulimit -n 65535 2>/dev/null || true
          dotnet run --no-build --configuration Release --project ProxyCollector 2>&1 | tee /tmp/fastnodes-run.log
        env:
          XRAY_BIN: /tmp/xraybin/xray
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH: ${{ secrets.WORKER_AUTH }}
          SourcesLimit: ${{ inputs.source_limit || '0' }}
          Sources: |
            # URL names containing explicit quality/testing hints are listed first; this is an ordering hint, not a live verification claim.
            https://raw.githubusercontent.com/F0rc3Run/F0rc3Run/refs/heads/main/Best-Results/proxies.txt
